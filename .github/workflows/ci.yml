# The suites are standalone scripts with no dependencies, so CI is just Node
# and a checkout -- no install step, nothing to cache.
#
# They run as a matrix rather than through `test/run.mjs` in one job because
# `clumps` takes minutes on its own (clump arrivals are rare, so its tolerances
# only hold pooled over many seeded runs) while the rest finish in seconds.
# Fanning out puts the wall clock at the slowest suite instead of their sum, and
# names the failing suite in the checks list without opening a log.
#
# `all-tests` at the bottom exists so branch protection has **one** name to
# require. Requiring the matrix jobs directly means listing every suite on every
# Node version, and a required check that stops reporting blocks all merges
# indefinitely -- so dropping a Node version or renaming a suite would wedge the
# repo until someone edited the ruleset to match. The gate's name never changes,
# whatever the matrix does underneath it.

name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's answer irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false          # one broken suite should not hide the others
      matrix:
        # The sources are ES modules in .js files with no package.json to
        # declare it, so Node has to detect the module syntax on its own --
        # which it only does unprompted from 22.7. test/run.mjs refuses to
        # start below that rather than failing incomprehensibly.
        node: ['22', '24']
        # Longest first. 18 jobs against a 20-job account ceiling means nothing
        # queues today, so this order changes nothing -- but the ceiling is per
        # *account*, so another repo's workflow can put this run into
        # contention without anything here changing. Under contention the
        # makespan is minimised by starting the long jobs first, and matrix
        # order is what decides dispatch order. It costs nothing to be right
        # about it in advance.
        suite: [clumps-spread, clumps-rate, clumps-stream,
                hexfield, hash, modules, smoke, sizes, pour]
    name: ${{ matrix.suite }} (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node test/run.mjs ${{ matrix.suite }}

  # The single check to require in branch protection.
  all-tests:
    needs: test
    # Without this the gate is skipped when the matrix fails, and a skipped
    # required check reads as success -- which would make it worse than nothing.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `result` on a matrix job is the aggregate: success only if every leg
      # succeeded. Read through the environment rather than interpolated into
      # the script, which is the habit to keep even where the value is a
      # controlled enum.
      - env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test matrix: $RESULT"
          [ "$RESULT" = success ]
